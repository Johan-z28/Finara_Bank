<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Finara Bank</title>
    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../../Style/signup.css">
</head>
<body>
<!-- CONTENEDOR PRINCIPAL -->
<main class="register-container">
    <!-- =====================================================
         CONTENEDOR IZQUIERDO - IMAGEN
    ====================================================== -->
    <section class="register-image">
        <img src="../../Style/image/signUp.png" alt="Finara Bank">
    </section>
    <!-- =====================================================
         CONTENEDOR DERECHO - FORMULARIO
    ====================================================== -->
    <section class="register-form-container">
        <div class="register-form">
            <!-- ENLACE PARA VOLVER AL INDEX (UX) -->
            <div class="form-back-wrapper">
                <a href="../../index.html" class="back-home-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver al inicio</span>
                </a>
            </div>
            <!-- Encabezado -->
            <div class="form-header">
                <div class="form-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <div>
                    <h1>Crear una cuenta</h1>
                    <p>
                        Completa el formulario para empezar a disfrutar
                        de todos los beneficios.
                    </p>
                </div>
            </div>
            <!-- FORMULARIO -->
            <form id="registroForm">
                <!-- FILA 1: Nombre completo y Correo electrónico -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="nombre">
                            Nombre completo <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-regular fa-user"></i>
                            <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Ej. María Gómez"
                                    required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="correo">
                            Correo electrónico <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-regular fa-envelope"></i>
                            <input
                                    type="email"
                                    id="correo"
                                    name="correo"
                                    placeholder="tu@correo.com"
                                    required>
                        </div>
                    </div>
                </div>
                <!-- FILA 2: Tipo de documento y Número de identificación -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="tipoDocumento">
                            Tipo de documento <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-regular fa-id-card"></i>
                            <select id="tipoDocumento" name="tipoDocumento" required style="width: 100%; background: transparent; border: none; color: #fff; outline: none; cursor: pointer;">
                                <option value="" disabled selected style="background: #111419; color: #888c95;">Selecciona</option>
                                <option value="CC" style="background: #111419; color: #fff;">Cédula de Ciudadanía</option>
                                <option value="CE" style="background: #111419; color: #fff;">Cédula de Extranjería</option>
                                <option value="TI" style="background: #111419; color: #fff;">Tarjeta de Identidad</option>
                                <option value="PP" style="background: #111419; color: #fff;">Pasaporte</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="documento">
                            Número de identificación <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-solid fa-hashtag"></i>
                            <input
                                    type="text"
                                    id="documento"
                                    name="documento"
                                    placeholder="Ej. 1023456789"
                                    required>
                        </div>
                    </div>
                </div>
                <!-- FILA 3: Fecha de nacimiento y Teléfono -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="fecha">
                            Fecha de nacimiento <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-regular fa-calendar"></i>
                            <input
                                    type="date"
                                    id="fecha"
                                    name="fecha"
                                    required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="telefono">
                            Teléfono <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone"></i>
                            <input
                                    type="tel"
                                    id="telefono"
                                    name="telefono"
                                    placeholder="+57 300 123 4567"
                                    required>
                        </div>
                    </div>
                </div>
                <!-- NOMBRE DE USUARIO (ÚNICO) -->
                <div class="input-group full-width">
                    <label for="username">
                        Nombre de usuario (único) <span>*</span>
                    </label>
                    <div class="input-box">
                        <i class="fa-solid fa-at"></i>
                        <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Ej. yull_mesa"
                                required>
                    </div>
                </div>
                <!-- CONTRASEÑAS -->
                <div class="form-row">
                    <div class="input-group">
                        <label for="password">
                            Contraseña <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Mín. 8 caracteres"
                                    required>
                            <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('password', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">
                            Confirmar contraseña <span>*</span>
                        </label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock"></i>
                            <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Repite la contraseña"
                                    required>
                            <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('confirmPassword', this)">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <!-- TÉRMINOS -->
                <div class="terms">
                    <label class="checkbox-container">
                        <input
                                type="checkbox"
                                id="terminos"
                                required>
                        <span class="checkmark"></span>
                        <span class="terms-text">
                             Acepto los
                             <a href="#">términos y condiciones</a>
                             y la
                             <a href="#">política de privacidad</a>.
                         </span>
                    </label>
                </div>
                <!-- BOTÓN -->
                <button
                        type="submit"
                        class="register-button">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Registrarse</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <!-- LOGIN -->
                <div class="login-link">
                    <span></span>
                    <p>
                        ¿Ya tienes una cuenta?
                        <a href="">
                            Inicia sesión
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </p>
                    <span></span>
                </div>
            </form>
        </div>
    </section>
</main>
<!-- JS Externo -->
<script type="module" src="../../Vanilla/formulario/signup.js"></script>
</body>
</html>
