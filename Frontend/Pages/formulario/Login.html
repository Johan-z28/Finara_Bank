<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Finara Bank</title>   
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../Style/Login.css"> 
</head>

<body>

    <div class="login-container">

        <div class="banner">
            <img src="../../Style/image/login.png" alt="Finara Bank">
        </div>

        <div class="login">

            <div class="login-box">

                <a href="../../index.html" class="back">
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver al inicio
                </a>

                <img src="../../Style/image/Logo_finara.svg" alt="Logo Finara" class="logo">

                <h1>Bienvenido de nuevo</h1>

                <p class="description">
                    Inicia sesión para acceder a tu cuenta
                </p>

                <form id="loginForm">

                    <label for="usuario">
                        Usuario
                    </label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
                    </div>

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

                        <button type="button" id="showPassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                    <div id="attempts">
                        Intentos restantes: 3
                    </div>

                    <a href="#" class="forgot" id="forgotPassword">
                        ¿Olvidaste tu contraseña?
                    </a>

                    <button type="submit" class="login-button">
                        Iniciar sesión
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

                <div class="register">
                    ¿No tienes una cuenta?
                    <a href="signup.html">Crear cuenta</a>
                </div>

            </div>

        </div>

    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../Vanilla/formulario/Login.js" defer></script>
</body>

</html>
