<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finara - Iniciar sesión</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../Style/Login.css">

    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- BANNER -->
        <div class="banner">

            <img
                src="../Style/image/banner.jpg"
                alt="Finara Bank"
            >

        </div>


        <!-- LOGIN -->
        <div class="login">

            <!-- CUADRO DEL LOGIN -->
            <div class="login-box">

                <!-- LOGO -->
                <img
                    src="../Style/image/Logo_finara.svg"
                    alt="Logo Finara"
                    class="logo"
                >


                <!-- TÍTULO -->
                <h1>Bienvenido de nuevo</h1>

                <p>
                    Inicia sesión para acceder a tu cuenta
                </p>


                <!-- FORMULARIO -->
                <form>

                    <!-- CORREO -->
                    <label for="email">
                        Correo electrónico
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Ingresa tu correo electrónico"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA -->
                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA OLVIDADA -->
                    <a href="#" class="forgot">
                        ¿Olvidaste tu contraseña?
                    </a>

                    <!-- BOTÓN -->
                    <button type="submit">

                        Iniciar sesión

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
